[project]
name = "agent-web"
version = "0.1.0"
description = "Verbatim web search and page fetching for AI coding agents: a CLI and a Claude Code plugin"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "browser-cookie3>=0.20",
    "curl-cffi>=0.10",
    "lxml>=5.3",
    "pymupdf>=2.0",
]

[project.optional-dependencies]
# Ships a pandoc binary for machines without a system pandoc (>= 3.0).
bundled-pandoc = ["pypandoc-binary>=1.13"]

[project.scripts]
web = "agent_web.cli:main"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_web"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PIE",
    "RET",
    "PTH",          # pathlib
    "PT",           # pytest style
    "S",            # bandit (security)
    "RUF",
]
ignore = [
    "S603",  # subprocess without shell: we always pass argument lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S310"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
stubPath = "typings"
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false
reportUnnecessaryTypeIgnoreComment = "error"
# Only rule-specific `# pyright: ignore[rule]` comments count; blanket `# type: ignore` doesn't.
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live' --strict-markers"
filterwarnings = ["error"]
markers = ["live: talks to the real internet and your browser cookies (run with: just test-live)"]

[tool.coverage.run]
source = ["agent_web"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
